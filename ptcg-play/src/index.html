<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="prizemap-runtime-revision" content="2026-11-07-update-recovery-check-2.6.5">
  <title>twinleaf.gg</title>
  <base href="./">
  <script>
    // A stable public page can already select its immutable asset release.
    // Otherwise derive the asset base for pinned and local entrypoints.
    (function () {
      var base = document.querySelector('base');
      var configured = base.getAttribute('href');
      if (configured && configured !== './') { return; }
      var release = location.pathname.match(/^\/releases\/[a-f0-9]{64}\//);
      if (release) {
        base.setAttribute('href', release[0]);
      } else if (/^https?:$/.test(location.protocol)) {
        base.setAttribute('href', '/');
      }
    })();
  </script>
  <script src="simulator-static.js"></script>

  <script>
    // Apply the embedded-app preference before Angular and its styles load.
    // The shared contract is intentionally simple: dark is the default and
    // only an explicit localStorage value can select light.
    (function () {
      var theme = 'dark';
      try {
        var savedTheme = window.localStorage.getItem('prizemap:theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          theme = savedTheme;
        }
      } catch (error) {
        // Storage can be unavailable in private or restricted WebViews.
      }
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body>
  <ptcg-app></ptcg-app>
</body>

</html>
