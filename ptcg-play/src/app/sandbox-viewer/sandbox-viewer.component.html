<ptcg-sidebar-container>
  <ptcg-content [loading]="loading || initializingSession">
    <!-- Auto-start loading screen when hash is provided -->
    <div class="sandbox-viewer-container" *ngIf="autoStartState">
      <div class="sandbox-viewer-card loading-card">
        <div class="loading-content">
          <img src="assets/prizemap-logo.webp" alt="PrizeMap Logo" class="loading-logo">
          <h1 class="loading-title">PrizeMap</h1>
          <div class="loading-subtitle">
            <span>powered by</span>
            <img src="assets/tl-open-beta.svg" alt="Twinleaf" class="twinleaf-logo">
          </div>
          <div class="loading-spinner">
            <mat-spinner diameter="40"></mat-spinner>
          </div>
          <p class="delayed-message" *ngIf="delayedMessage">{{ delayedMessage }}</p>
        </div>
        <div class="sandbox-viewer-error" *ngIf="error">
          <svg class="ptcg-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2zm0-4h-2V7h2z"></path></svg>
          <span>{{ error }}</span>
        </div>
      </div>
    </div>

    <!-- Regular entry form when no hash -->
    <div class="sandbox-viewer-container" *ngIf="!autoStartState">
      <div class="sandbox-viewer-card">
        <h2 class="sandbox-viewer-title">{{ 'SANDBOX_VIEWER_TITLE' | translate }}</h2>
        <p class="sandbox-viewer-description">{{ 'SANDBOX_VIEWER_DESCRIPTION' | translate }}</p>

        <div class="sandbox-viewer-status" *ngIf="initializingSession">
          <mat-spinner diameter="20"></mat-spinner>
          <span>{{ 'SANDBOX_VIEWER_CONNECTING' | translate }}</span>
        </div>

        <div class="sandbox-viewer-status success" *ngIf="isReady && !initializingSession">
          <svg class="ptcg-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-2 15-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8z"></path></svg>
          <span>{{ 'SANDBOX_VIEWER_READY' | translate }}</span>
        </div>

        <mat-form-field appearance="outline" class="sandbox-viewer-input">
          <mat-label>{{ 'SANDBOX_VIEWER_INPUT_LABEL' | translate }}</mat-label>
          <textarea matInput [(ngModel)]="stateDataInput" rows="8"
            placeholder="{{ 'SANDBOX_VIEWER_INPUT_PLACEHOLDER' | translate }}"
            [disabled]="loading || initializingSession || !isReady">
          </textarea>
        </mat-form-field>

        <div class="sandbox-viewer-error" *ngIf="error">
          <svg class="ptcg-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-2h2zm0-4h-2V7h2z"></path></svg>
          <span>{{ error }}</span>
        </div>

        <div class="sandbox-viewer-actions">
          <button mat-raised-button color="primary" (click)="loadGameState()"
            [disabled]="loading || initializingSession || !isReady || !stateDataInput.trim()">
            <svg class="ptcg-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5v14l11-7z"></path></svg>
            {{ 'SANDBOX_VIEWER_LOAD_BUTTON' | translate }}
          </button>
          <button mat-button (click)="clearInput()" [disabled]="loading || initializingSession">
            <svg class="ptcg-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"></path></svg>
            {{ 'SANDBOX_VIEWER_CLEAR_BUTTON' | translate }}
          </button>
          <button mat-button color="warn" (click)="retryConnection()" *ngIf="error && !initializingSession">
            <svg class="ptcg-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.93 9h-2.02A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h9V2z"></path></svg>
            {{ 'SANDBOX_VIEWER_RETRY_BUTTON' | translate }}
          </button>
        </div>
      </div>
    </div>
  </ptcg-content>
</ptcg-sidebar-container>
