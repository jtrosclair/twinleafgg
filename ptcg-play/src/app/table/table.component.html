<ptcg-content [loading]="waiting">
  <div class="ptcg-table" *ngIf="gameState" [class.is-complete]="gameState.turnComplete"
    [attr.inert]="gameState.turnComplete ? '' : null" [attr.aria-hidden]="gameState.turnComplete ? 'true' : null">
    <ptcg-board [clientId]="clientId" [gameState]="gameState" [topPlayer]="topPlayer" [bottomPlayer]="bottomPlayer"
      [isHandHidden]="isHandHidden" (toggleHand)="toggleHandVisibility()"></ptcg-board>
    <ptcg-hand *ngIf="!hasActivePrompt() && !isHandHidden" [clientId]="clientId" [gameState]="gameState"
      [player]="bottomPlayer"></ptcg-hand>
    <ptcg-prompt [gameState]="gameState" [clientId]="clientId"></ptcg-prompt>
  </div>
</ptcg-content>
