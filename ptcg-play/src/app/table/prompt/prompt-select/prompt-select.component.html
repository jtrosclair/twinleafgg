<div class="ptcg-prompt-title">
  <h2 translate>PROMPT_SELECT_TITLE</h2>
  <div class="ptcg-u-spacer"></div>
  <button mat-button mat-icon-button (click)="minimize()">
    <svg class="ptcg-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"></path></svg>
  </button>
</div>

<div class="ptcg-prompt-content">
  <p [translate]="'GAME_MESSAGES.' + message"></p>

  <form #form="ngForm" autocomplete="off">

    <!-- Select -->
    <mat-form-field>
      <mat-select [(value)]="result">
        <mat-option *ngFor="let option of options; index as i" [value]="i">
          {{ option }}
        </mat-option>
      </mat-select>
    </mat-form-field>

  </form>
</div>

<div class="ptcg-prompt-actions">
  <button mat-raised-button *ngIf="allowCancel" [disabled]="gameState.deleted" (click)="cancel()">
    {{ 'BUTTON_CANCEL' | translate }}
  </button>
  <button mat-raised-button [disabled]="gameState.deleted" (click)="confirm()">
    {{ 'BUTTON_OK' | translate }}
  </button>
</div>
