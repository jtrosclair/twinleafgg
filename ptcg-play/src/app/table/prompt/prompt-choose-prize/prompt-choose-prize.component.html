<div class="fullscreen-wrapper">
  <div class="fullscreen-overlay"></div>
  <div class="fullscreen-container">
    <div class="ptcg-prompt-title">
      <h2 translate>PROMPT_CHOOSE_PRIZE_TITLE</h2>
      <div class="ptcg-u-spacer"></div>
      <button mat-button mat-icon-button (click)="minimize()">
        <svg class="ptcg-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"></path></svg>
      </button>
    </div>

    <!-- Message Section -->
    <div class="prompt-message">
      <p>{{message}}</p>
    </div>

    <!-- Prize Selection Grid -->
    <div class="ptcg-prompt-content">
      <div class="ptcg-prizes">
        <div class="ptcg-prizes-grid">
          <div *ngFor="let prize of prizes; let i = index; trackBy: trackByPrize" class="ptcg-prize-slot"
            [class.selected]="isPrizeSelected(i)" [class.empty]="!prize || prize.cards.length === 0"
            (click)="onPrizeClick(prize, i)">
            <div class="prize-number">{{[5,6,3,4,1,2][i]}}</div>
            <ptcg-board-card *ngIf="prize && prize.cards.length > 0" [cardList]="prize"
              [isFaceDown]="prize.isSecret"
             >
            </ptcg-board-card>
            <div *ngIf="!prize || prize.cards.length === 0" class="ptcg-empty-prize-slot"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="ptcg-prompt-actions">

      <button *ngIf="allowedCancel" mat-raised-button class="cancel-button" [disabled]="gameState.deleted"
        (click)="cancel()">
        {{ 'BUTTON_CANCEL' | translate }}
      </button>

      <button mat-raised-button color="primary" class="confirm-button" [disabled]="gameState.deleted || isInvalid"
        (click)="confirm()">
        {{ 'BUTTON_OK' | translate }}
      </button>
    </div>
  </div>
</div>
