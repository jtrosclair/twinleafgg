<dnd-preview [allBackends]="true">
  <ng-template let-type let-item="item">
    <ptcg-card *ngIf="type === 'CARD_SELECTOR'" class="selector-drag-preview" [card]="item.data.card"
      [cardback]="item.data.isSecret" [showCardName]="false"></ptcg-card>
  </ng-template>
</dnd-preview>

<div class="selector" [class.inspecting-board]="boardView" [class.discard-selector]="isDiscard">
  <div class="selector-scrim" [hidden]="boardView"
    [@selectorVisibility]="{value: minimized ? 'hidden' : 'shown', params: {duration: fadeDuration}}"></div>

  <div class="source-preview" [hidden]="boardView" [attr.inert]="minimized ? '' : null"
    [@selectorVisibility]="{value: minimized ? 'hidden' : 'shown', params: {duration: fadeDuration}}">
    <ptcg-card *ngIf="sourceCard" [card]="sourceCard" [showCardName]="false"></ptcg-card>
  </div>

  <button type="button" class="inspect-board" (click)="toggleBoard()" [attr.aria-expanded]="!minimized"
    aria-controls="card-selector-panel">
    {{ (minimized ? 'PROMPT_RETURN_TO_SELECTION' : 'PROMPT_INSPECT_BOARD') | translate }}
    <svg class="ptcg-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path [attr.d]="minimized ? 'M7.41 15.41 12 10.83l4.59 4.58L18 14l-6-6-6 6z' : 'M12 4.5c-5 0-9.27 3.11-11 7.5 1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9zm0-7.5a3 3 0 1 0 0 6 3 3 0 0 0 0-6z'"></path></svg>
  </button>

  <section id="card-selector-panel" class="selector-panel" [hidden]="boardView"
    [attr.inert]="minimized ? '' : null" [attr.aria-hidden]="minimized ? 'true' : null"
    [@selectorVisibility]="{value: minimized ? 'hidden' : 'shown', params: {duration: fadeDuration}}"
    (@selectorVisibility.done)="onVisibilityDone($event)"
    role="dialog" aria-modal="true" aria-labelledby="card-selector-instruction">
    <header class="instruction-bar">
      <div>
        <h2 id="card-selector-instruction" [translate]="instructionKey" [translateParams]="instructionParams"></h2>
        <p class="selector-hint" translate>PROMPT_SELECTOR_GESTURES</p>
      </div>
      <button *ngIf="isDiscard" type="button" class="confirm-button done-button"
        [disabled]="gameState.deleted || isInvalid" (click)="confirm()">
        {{ 'BUTTON_DONE' | translate }}
      </button>
    </header>

    <span class="selection-count" role="status" aria-live="polite">
      {{ 'PROMPT_SELECTION_COUNT' | translate: { count: selectedCards.length, max: maxCards } }}
    </span>

    <div *ngIf="showTabs" class="selector-tabs" role="tablist" aria-label="Card filter">
      <button *ngFor="let tab of ['Valid', 'All']" type="button" role="tab"
        [class.active]="currentTab === tab" [attr.aria-selected]="currentTab === tab"
        (click)="onTabChange(tab, cardRow)">
        {{ (tab === 'Valid' ? 'PROMPT_VALID_CARDS' : 'FORMAT_ALL') | translate }}
      </button>
    </div>

    <div class="selection-tray" [class.setup-game]="isSetupGame" [dropTarget]="trayTarget"
      [class.drop-ready]="trayOver | async" role="group" aria-label="Drop cards here to select them"
      (touchstart)="onTouchStart($event, false)" (touchmove)="onTouchMove($event)"
      (touchend)="onTouchEnd()" (touchcancel)="onTouchEnd()">
      <div class="selection-slots">
        <div *ngFor="let slot of slots" class="selection-slot" [class.filled]="slotCards[slot]"
          [dropTarget]="slotTargets[slot]" [class.drop-ready]="slotOver[slot] | async"
          [class.active-slot]="isSetupGame && slot === 0" [attr.aria-label]="slotRules[slot].label + ' slot'">
          <span *ngIf="!slotCards[slot]" class="slot-label">{{ slotRules[slot].label }}</span>
          <button *ngIf="slotCards[slot] as item" type="button" class="selected-card"
            [dragSource]="slotSources[slot]" [noHTML5Preview]="true" [class.dragging]="draggingIndex === item.index"
            [attr.aria-label]="'Inspect selected ' + cardName(item)" (click)="showCardInfo(item)"
            aria-keyshortcuts="Alt+ArrowDown" (keydown.alt.arrowdown)="$event.preventDefault(); removeCard(item)">
            <ptcg-card [card]="item.card" [showCardName]="false" [cardback]="item.isSecret"></ptcg-card>
          </button>
        </div>
      </div>
    </div>

    <div #cardRow class="card-row" role="region" [dropTarget]="rowTarget" [class.drop-ready]="rowOver | async"
      aria-label="Cards. Swipe horizontally to browse. Drag selected cards here to return them."
      tabindex="0" (wheel)="onWheel($event, cardRow)" (touchstart)="onTouchStart($event)"
      (touchmove)="onTouchMove($event)" (touchend)="onTouchEnd()" (touchcancel)="onTouchEnd()">
      <div class="card-row-inner">
        <div *ngFor="let stack of cardStacks; trackBy: trackStack" class="card-choice"
          [class.unavailable]="!stack.front.isAvailable">
          <ptcg-card *ngFor="let copy of stack.backingCards; let depth = index" class="stack-copy"
            [style.--stack-depth]="depth + 1" [card]="copy.card" [showCardName]="false" aria-hidden="true">
          </ptcg-card>
          <button type="button" class="choice-card" [class.draggable]="canSelect(stack.front)"
            [dragSource]="stack.source" [noHTML5Preview]="true"
            [class.dragging]="draggingIndex === stack.front.index"
            [attr.aria-label]="stackLabel(stack)" (click)="showCardInfo(stack.front)"
            aria-keyshortcuts="Alt+ArrowUp" (keydown.alt.arrowup)="$event.preventDefault(); selectCard(stack.front)">
            <ptcg-card [card]="stack.front.card" [showCardName]="false" [cardback]="stack.front.isSecret"></ptcg-card>
          </button>
          <span *ngIf="canSelect(stack.front)" class="playable-arrow" aria-hidden="true"></span>
          <span *ngIf="stack.copies.length > 1" class="stack-count" aria-hidden="true">{{ stack.copies.length }}</span>
        </div>
        <p *ngIf="!promptItems.length" class="empty-row">
          {{ (selectedCards.length ? 'PROMPT_SELECTION_READY' : 'PROMPT_NO_VALID_CARDS') | translate }}
        </p>
      </div>
    </div>

    <footer class="selector-actions" *ngIf="!isDiscard || prompt.options.allowCancel">
      <button *ngIf="prompt.options.allowCancel" type="button" class="cancel-button" [disabled]="gameState.deleted"
        (click)="cancel()">{{ 'BUTTON_CANCEL' | translate }}</button>
      <button *ngIf="!isDiscard" type="button" class="confirm-button"
        [disabled]="gameState.deleted || isInvalid" (click)="confirm()">{{ 'BUTTON_CONFIRM' | translate }}</button>
    </footer>
  </section>
</div>
