<!-- Move selection overlay out of container -->
<ptcg-board-selection-overlay></ptcg-board-selection-overlay>

<dnd-preview [allBackends]="true">
  <ng-template let-type let-item="item">
    <ng-container [ngSwitch]="type">
      <div class="ptcg-card" *ngSwitchCase="'BOARD_SLOT'">
        <img class="ptcg-card-preview" [ptcgImageCache]="item.scanUrl" ptcgDropHighlight="outside"
          [ptcgDropHighlightVisible]="boardHighlight$ | async">
      </div>
      <div class="ptcg-card" *ngSwitchCase="'HAND_CARD'">
        <ptcg-card class="ptcg-card-preview" [card]="item.data.card"
          [artworksContext]="bottomPlayer?.hand?.artworksMap ? bottomPlayer?.hand : gameState"
          ptcgDropHighlight="outside" [ptcgDropHighlightVisible]="boardHighlight$ | async">
        </ptcg-card>
      </div>
    </ng-container>
  </ng-template>
</dnd-preview>

<div id="top_div" [class.active]="isTopPlayerActive"></div>
<div id="bottom_div" [class.active]="isBottomPlayerActive"></div>

<div class="ptcg-board-outer-container responsive-board">
  <div class="ptcg-board-container" [class.upside-down]="isUpsideDown" [dropTarget]="boardTarget">
    <div class="ptcg-board-player upside-down">
      <!-- Top Active -->
      <div class="ptcg-board-row ptcg-board-active">
        <ptcg-board-card [cardList]="topPlayer?.active" [owner]="topPlayer?.id === clientId"
          (cardClick)="onCardClick($event, topPlayer?.active)" [player]="PlayerType.TOP_PLAYER" [slot]="SlotType.ACTIVE"
          [index]="0">
        </ptcg-board-card>
      </div>

      <!-- Top Bench -->
      <div class="ptcg-board-row ptcg-board-bench" [style.--bench-columns]="benchColumns(topPlayer)"
        [style.--bench-rows]="benchRows(topPlayer)" aria-label="Opponent's Bench">
        <ptcg-board-card *ngFor="let slot of topBench
        | slice:0:(topPlayer?.bench.length || defaultBenchSize); index as i" [cardList]="topPlayer?.bench[i]"
          [style.grid-area]="benchSlotArea(topPlayer, i)"
          [class.bench-slot-empty]="!topPlayer?.bench[i]?.cards.length"
          [owner]="topPlayer?.id === clientId" (cardClick)="onCardClick($event, topPlayer?.bench[i])"
          [player]="PlayerType.TOP_PLAYER" [slot]="SlotType.BENCH" [index]="i">
        </ptcg-board-card>
      </div>

      <ptcg-board-zone-button class="opponent-discard" label="Discard"
        [count]="topPlayer?.discard?.cards?.length || 0" [countBelow]="true" [alignRight]="true"
        [ariaLabel]="'Opponent discard: ' + (topPlayer?.discard?.cards?.length || 0) + ' cards'"
        (zoneClick)="onDiscardClick(topPlayer?.discard?.cards[0], topPlayer?.discard)">
      </ptcg-board-zone-button>

    </div>



    <div class="ptcg-board-player">

      <!-- Bottom Active -->
      <div class="ptcg-board-row ptcg-board-active">
        <div class="ptcg-board-drop-target" [dropTarget]="bottomActiveTarget" ptcgDropHighlight="outside"
          [ptcgDropHighlightVisible]="bottomActiveHighlight$ | async">
          <ptcg-board-card
            [class.draggable]="!gameState.deleted && bottomPlayer?.id === clientId && bottomPlayer?.active.cards.length > 0"
            [dragSource]="bottomActive.source" [noHTML5Preview]="true" [cardList]="bottomPlayer?.active"
            [owner]="bottomPlayer?.id === clientId" (cardClick)="onActiveClick($event, bottomPlayer?.active)"
            [player]="PlayerType.BOTTOM_PLAYER" [slot]="SlotType.ACTIVE" [index]="0">
          </ptcg-board-card>
        </div>
      </div>

      <!-- Bottom Bench -->
      <div class="ptcg-board-row ptcg-board-bench" [style.--bench-columns]="benchColumns(bottomPlayer)"
        [style.--bench-rows]="benchRows(bottomPlayer)" [dropTarget]="benchTarget"
        ptcgDropHighlight [ptcgDropHighlightVisible]="benchHighlight$ | async" aria-label="Your Bench">
        <div class="ptcg-board-drop-target" *ngFor="let slot of bottomBench
        | slice:0:(bottomPlayer?.bench.length || defaultBenchSize)" [dropTarget]="bottomBenchTarget[slot.index]"
          [style.grid-area]="benchSlotArea(bottomPlayer, slot.index)"
          [class.bench-slot-empty]="!bottomPlayer?.bench[slot.index]?.cards.length"
          ptcgDropHighlight="outside" [ptcgDropHighlightVisible]="bottomBenchHighlight$[slot.index] | async">
          <ptcg-board-card
            [class.draggable]="!gameState.deleted && bottomPlayer?.id === clientId && bottomPlayer?.bench[slot.index].cards.length > 0"
            [dragSource]="slot.source" [noHTML5Preview]="true" [cardList]="bottomPlayer?.bench[slot.index]"
            [owner]="bottomPlayer?.id === clientId"
            (cardClick)="onBenchClick($event, bottomPlayer?.bench[slot.index], slot.index)"
            [player]="PlayerType.BOTTOM_PLAYER" [slot]="SlotType.BENCH" [index]="slot.index">
          </ptcg-board-card>
        </div>
      </div>

      <ptcg-board-zone-button class="player-prizes" label="Prizes" [count]="getPrizeCount(bottomPlayer)"
        [ariaLabel]="'Your prizes: ' + getPrizeCount(bottomPlayer) + ' remaining'"
        (zoneClick)="onPrizesModalClick(bottomPlayer)"></ptcg-board-zone-button>

      <ptcg-board-zone-button class="player-discard" label="Discard"
        [count]="bottomPlayer?.discard?.cards?.length || 0" [alignRight]="true"
        [ariaLabel]="'Your discard: ' + (bottomPlayer?.discard?.cards?.length || 0) + ' cards'"
        (zoneClick)="onDiscardClick(bottomPlayer?.discard?.cards[0], bottomPlayer?.discard)">
      </ptcg-board-zone-button>

      <button type="button" class="field-zone-button player-end-turn" aria-haspopup="dialog"
        [disabled]="!canEndTurn" (click)="endTurn.emit()">
        <span class="field-zone-label">End turn</span>
      </button>
      <button type="button" class="field-zone-button player-deck-count" aria-haspopup="dialog"
        [disabled]="!bottomPlayer?.deck?.cards?.length"
        [attr.aria-label]="'Your deck: ' + (bottomPlayer?.deck?.cards?.length || 0) + ' cards'"
        (click)="onDeckClick(bottomPlayer?.deck?.cards[0], bottomPlayer?.deck)">
        <span class="field-zone-label">Deck</span>
        <span class="field-zone-total">{{bottomPlayer?.deck?.cards?.length || 0}}</span>
      </button>

    </div>
    <div class="board-shared-zones" aria-label="Shared stadium and lost zones">
      <button *ngIf="topPlayer?.lostzone?.cards?.length" type="button"
        class="field-zone-button lost-zone-button opponent-lost" aria-haspopup="dialog"
        [attr.aria-label]="'Opponent lost zone: ' + topPlayer.lostzone.cards.length + ' cards'"
        (click)="onLostZoneClick(topPlayer.lostzone.cards[0], topPlayer.lostzone)">
        <span class="field-zone-label">Lost</span>
        <span class="field-zone-total">{{topPlayer.lostzone.cards.length}}</span>
      </button>
      <button type="button" class="shared-stadium" [class.stadium-empty]="!stadiumCard?.cards?.length"
        [disabled]="!stadiumCard?.cards?.length" aria-haspopup="dialog"
        [attr.aria-label]="stadiumCard?.cards?.length ? 'Shared stadium: ' + stadiumCard.cards[0].name : 'Empty stadium zone'"
        (click)="onStadiumClick(stadiumCard.cards[0])">
        <ptcg-board-card *ngIf="stadiumCard?.cards?.length; else emptyStadium" class="stadium-card"
          [cardList]="stadiumCard" [owner]="stadiumOwner" aria-hidden="true">
        </ptcg-board-card>
        <ng-template #emptyStadium><span>Stadium</span></ng-template>
      </button>
      <button *ngIf="bottomPlayer?.lostzone?.cards?.length" type="button"
        class="field-zone-button lost-zone-button player-lost" aria-haspopup="dialog"
        [attr.aria-label]="'Your lost zone: ' + bottomPlayer.lostzone.cards.length + ' cards'"
        (click)="onLostZoneClick(bottomPlayer.lostzone.cards[0], bottomPlayer.lostzone)">
        <span class="field-zone-label">Lost</span>
        <span class="field-zone-total">{{bottomPlayer.lostzone.cards.length}}</span>
      </button>
    </div>
  </div>
</div>
